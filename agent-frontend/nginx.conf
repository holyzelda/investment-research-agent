server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /investment {
        return 308 /investment/;
    }

    location /investment/ {
        try_files $uri $uri/ /investment/index.html;
    }

    # The trusted platform gateway must own these routes. Never forward raw identity headers here.
    location /gateway/ {
        return 503;
    }

    location / {
        return 404;
    }
}
