schema_version: '1'
owner_app_id: ir_agent
display_name: 朱雀投研智能体
description: 储能项目投研测算。根据用户描述收集项目省份、功率、容量、系统时长、节点、电压等级和运营周期，调用测算核心算法并返回结构化结果。
skip_station_required_check: true

domains:
  - domain_code: energy_storage_calculation
    display_name: 储能项目测算
    description: |
      发起储能项目投研测算。需要识别项目省份、功率、容量、系统时长、节点、电压等级和运营周期。
      用户提及节点时，先查询该省可用节点并完成校验；节点确认且参数齐备后调用测算接口，返回任务、会话、版本和状态。
      只处理储能项目测算，不处理历史结果查询、测算结果查询、报告查询、参数调整或其他业务域。
    executor:
      mode: autonomous
      clarify_on_no_tool_call: true
    domain_lexicon:
      primary_terms:
        - 储能测算
        - 项目测算
        - 投研测算
        - 储能项目收益
        - 储能项目IRR
      secondary_terms:
    default_recommended_questions:
    - 测算山西 100MW/400MWh 储能
    - 测算蒙西 祥泰站 2小时 独立储能系统
    - 测算宁夏 100MW/200MWh 储能
    prompts:
      domain_guard: |
        【储能项目测算规则】
        - 项目规模须满足下列任一组合：
          1. power_mw 与 capacity_mwh；
          2. power_mw 与 duration_hours；
          3. capacity_mwh 与 duration_hours；
          4. 仅 duration_hours。仅有 duration_hours 时允许调用，后端会按默认功率归一化。
        - 用户同时提供功率、容量和时长且三者不一致时，必须追问确认，不得自行覆盖任一参数。
        - operation_years 未提及时不追问、不传该参数；明确提及时仅接受 15 或 20。
        - voltage_kv 未提及时不追问、不传该参数；明确提及时仅接受 110 或 220。

        【省份前置规则】
        - 调用 query_station_nodes 或 create_calculation_task 前，必须取得明确的标准省份或区域名称。
        - 用户原文中已明确提及省份或区域时，直接使用，不追问更细的地级市。
        - 用户提到节点但没有提供省份时，询问该节点所在的省份或区域；保留用户已提供的节点名称和其他测算参数，不调用任何工具。
        - 不得根据节点名称、常识或地名联想推断省份。
        - 省份映射规则：所有 province 最终都要映射为下方省份或区域之一【浙江、上海、广东、江苏、湖南、深圳、海南、重庆、河南、安徽、湖北、天津、四川、陕西、贵州、辽宁、吉林、山东、黑龙江、山西、福建、江西、新疆、冀北、河北南网、蒙东、青海、云南、北京、广西、宁夏、蒙西、甘肃、西藏、冀南】。
        - 别称规则：
          1. 内蒙/内蒙古分为蒙东和蒙西，用户未明确指出时必须追问；
          2. 用户只说河北且未明确冀北、冀南或河北南网时，必须追问具体区域，不得自行选择。

        【节点校验与匹配规则】
        - 用户未提到节点时，不调用 query_station_nodes，调用测算工具时不传 node_name。
        - 用户同时提供省份和节点时，必须先调用 query_station_nodes 校验，禁止直接调用 create_calculation_task。
        - 节点只能从 query_station_nodes 返回的 items 中选择，不得使用模型记忆、常识或自行编造的节点。
        - 匹配时按以下顺序处理：
          1. 优先按标准节点名称精确匹配；
          2. 可以清除用户输入的前后空格以及末尾通用“节点”二字后再次匹配；
          3. 规范化后唯一命中时，必须使用 items 中未经改写的原始标准名称作为 node_name；
          4. 没有唯一命中时，不得调用 create_calculation_task；
          5. 从 items 中选择最多三个名称明显相关的候选节点，请用户确认；候选必须逐字来自 items，不得改写、缩写、补全或编造；
          6. 没有明显相关候选时，不得为了凑足三个而返回无关节点，应请用户检查节点名称或省份；
          7. 用户确认候选后，使用其选择的标准节点名称继续测算。
        - query_station_nodes 返回 items 为空时，说明该省或区域暂无可用节点数据。告知用户暂时无法校验其节点，并询问是否改为不带节点测算；未经用户明确同意，不得自动清空 node_name 继续测算。
        - 节点查询接口失败时，说明节点信息暂时查询失败且本次未发起测算；不得将接口失败表述为节点不存在，也不得绕过校验继续测算。

        【测算调用与结果处理规则】
        - province 已取得、节点处理完成且项目规模满足要求后，只调用一次 create_calculation_task。
        - 用户要求带节点测算时，node_name 必须是 query_station_nodes 返回并经用户确认或唯一匹配的标准名称。
        - create_calculation_task 返回 status=completed 时，如实保留并返回 conversationId、taskId、version 和 status。完整测算结果由业务系统根据 taskId 获取，中台不得继续调用工具查询结果。
        - create_calculation_task 返回 status=failed 时，如实告知测算失败；仅可展示适合用户理解的业务错误，不得泄露内部堆栈、数据库信息或内部地址。
        - 节点查询或测算失败后，不得自动更换省份、节点、规模、电压等级或运营周期，不得自动重试；只有用户确认新输入后才能再次调用。
        - 保留后端响应，不重算、不改写、不推断或补全任何财务指标。
    tools:
      - name: query_station_nodes
        description: |
          查询指定省份或区域下可用于储能测算的标准节点名称列表。
          当用户明确要求带节点测算时，先调用本工具校验用户提供的节点；只有返回列表中存在唯一、明确匹配的节点，或用户从返回候选中确认节点后，才能发起测算。
          本工具仅返回节点数据，不发起测算。province 必须是标准省份或区域名称；用户未提供 province 时应先追问，不得根据节点名称猜测省份。
        params:
          province:
            type: str
            required: true
            message: 请提供节点所在的省份或区域。
        http:
          method: GET
          path: /ir/calc/stations
          query:
            province: "{province}"
        answer_type: energy_storage.node_list
        render_hint: 返回指定省份或区域的标准节点名称列表，节点位于 biz.data.items 中；只能从该列表中匹配或提供候选，不得编造节点。

      - name: create_calculation_task
        description: |
          发起储能项目投研测算。
          province 为项目所在省份；规模可由功率 power_mw（MW）、容量 capacity_mwh（MWh）、
          系统时长 duration_hours（小时）任意有效组合提供；node_name 为可选节点名称；
          voltage_kv 仅支持 110 或 220；operation_years 仅支持 15 或 20。
          用户要求带节点测算时，node_name 必须来自 query_station_nodes 返回的标准节点列表，且已唯一匹配或经用户确认。
          本工具仅返回测算任务摘要，不返回完整财务结果；完整结果由业务系统根据 taskId 获取和展示。
        enable_ai_summary: false
        idempotent: false
        params:
          province:
            required: true
            message: 请提供项目所在省份。
          capacity_mwh:
            type: float
            min: 0.000001
          power_mw:
            type: float
            min: 0.000001
          duration_hours:
            type: float
            min: 0.000001
          node_name:
            type: str
          voltage_kv:
            type: int
            enum: [110, 220]
          operation_years:
            type: int
            enum: [15, 20]
        http:
          method: POST
          path: /ir/calc/tasks
          body:
            province: "{province}"
            capacity_mwh: "{capacity_mwh}"
            power_mw: "{power_mw}"
            duration_hours: "{duration_hours}"
            node_name: "{node_name}"
            voltage_kv: "{voltage_kv}"
            param_overrides:
              operation_years: "{operation_years}"
        answer_type: energy_storage.calculation_task
        render_hint: 返回测算任务摘要，包括 conversationId、taskId、version 和 status；完整测算结果由业务系统根据 taskId 获取，中台不查询结果接口。