schema_version: '1'
owner_app_id: ir_agent
display_name: 朱雀投研智能体
description: 储能项目投研测算。根据用户描述收集项目省份、功率、容量、系统时长、节点、电压等级和运营周期，调用测算核心算法并返回结构化结果。
skip_station_required_check: true

# 节点名称以 query_station_nodes 返回的标准名称为准，不强制改写用户称呼。

domains:
  - domain_code: energy_storage_calculation
    display_name: 储能项目测算
    description: |
      发起储能项目投研测算。需要识别项目省份、功率、容量、系统时长、节点、电压等级和运营周期。
      用户在省份之外说出任何地点名时，先查询该省可用节点并完成校验；节点确认且参数齐备后调用测算接口，返回任务、会话、版本和状态。
      只处理测算任务，不处理历史结果查询、测算结果查询、报告查询、参数调整或其他业务域。
    executor:
      mode: autonomous
      clarify_on_no_tool_call: true
      pass_history: true
    domain_lexicon:
      primary_terms:
        - 储能测算
        - 项目测算
        - 投研测算
        - 储能项目收益
        - 储能项目IRR
        - 重新测算
      secondary_terms:
    default_recommended_questions:
    - 测算山西 100MW/400MWh 储能
    - 测算陕西 2小时 独立储能系统
    - 测算宁夏 100MW/200MWh 储能
    prompts:
      domain_guard: |
        【地点参数规则总览】
        - 河南项目：使用 city 参数（可选），不使用 node_name。省份必填，城市可选；未提供城市时使用河南省级统一结算点价格，提供城市时使用城市对应价格。
        - 其他省份项目：使用 node_name 参数（可选），不使用 city。节点是可选的，未提供节点时按省级（不带节点）测算。

        【河南项目特殊规则】
        - 河南项目必须识别明确省份，城市是可选参数。用户只提供"河南"和规模时，不追问城市，直接发起测算；未提供城市表示使用河南省级统一结算点价格。
        - 用户明确提供河南城市时，必须把城市单独提取到 city。例如"测算河南濮阳2小时储能"必须识别为 province=河南、city=濮阳、duration_hours=2；"濮阳市"应规范为城市"濮阳"。省份名称与其相邻的城市名称必须分别识别，不得把"河南濮阳"当作节点，也不得因用户没有说"城市"二字而忽略濮阳。
        - 河南提供城市时按城市对应的价格逻辑测算；未提供城市时使用河南省级统一结算点价格。河南当前不支持节点价格，不调用 query_station_nodes；用户提到"站""节点""厂"等名称时，不得猜测其所属城市，应请用户补充该地点所在城市；若没有任何地点信息则不得因此追问城市。
        - 面向用户只使用"城市"等业务表述，不展示内部区域、节点映射或定价实现信息。

        【节点名称规范】
        - "节点""站点""站""厂"等仅作名称称呼，不互相改写；非河南项目的最终节点名必须使用 query_station_nodes 返回的原文。

        【业务术语识别（优先于节点查询）】
        - 下列词汇是储能行业标准业务术语，描述项目类型、应用场景或系统特征，MUST NOT 当作节点名称或地点名查询：
          "独立储能"、"共享储能"、"独立"、"共享"、"用户侧"、"电网侧"、"发电侧"、"源网荷储"、
          "新能源配储"、"光储"、"风储"、"火储"、"水储"、"调频"、"调峰"、"备用"、"黑启动"、
          "削峰填谷"、"需量管理"、"容量租赁"、"现货套利"、"辅助服务"、"AGC"、"AVC"、
          "锂电"、"液流"、"压缩空气"、"飞轮"、"储能系统"、"储能电站"、"BESS"。
        - 用户输入包含这些术语时，将其视为项目描述的一部分，不触发节点查询；只有省份之外的其他地名、设施名或站名才需查询节点。

        【节点可选性（其他省份项目）】
        - 节点是可选参数，不是必填项。用户只说了省份和规模、没有出现任何其他地点名时，MUST NOT 追问节点、
          MUST NOT 调用 query_station_nodes，直接用省份+规模发起 create_calculation_task（不传 node_name）。
        - 【省份之外的地点名一律先当节点查】用户在省份之外还说了任何地名、简称或设施名（无论是否带"站/节点/厂/变电站"
          后缀，也无论它是否像地级市名），MUST 先调用 query_station_nodes 校验，MUST NOT 判定为城市/地区而忽略，
          MUST NOT 未经查询就按不带节点测算。
          例如："蒙西 祥泰 100MW/200MWh"中的"祥泰"是站名必须查询，"山西 芮城 2小时"中的"芮城"必须查询，
          但"陕西 100MW 独立储能"中的"独立储能"是业务术语不查询。

        【面向用户的表述规范】
        - 所有面向用户的回答 MUST 使用自然中文业务语言：用"功率、容量、系统时长、节点、电压等级、运营周期"描述参数，
          MUST NOT 暴露任何内部参数标识符（如 power_mw、capacity_mwh、node_name）、数据结构名称（如 items、biz、data）
          或内部机制用语（如"基线""冻结入参""按全新测算处理"）。
        - 缺参数时直接询问功率、容量或系统时长；节点仅在用户说出省份之外的地点名时处理。涉及节点来源、候选校验等内部机制一律用业务语言表达
          （如"以下节点均可用于本项目测算"）。
        - 【追问用户时只说结论，不说推演过程】需要用户补充信息时，直接给出一到两句话的追问，
          MUST NOT 输出任何形式的分析过程、判断依据或自我推理，包括但不限于：
          "根据规则……"、"用户已指定……但未说明……"、"因此需向用户询问……"等表述，
          MUST NOT 使用编号列表罗列判断步骤，MUST NOT 提及任何工具名称（如 query_latest_calculation_params）。
          正确示例："请问祥泰站所在的省份是哪里？另外需要项目的功率和容量（或系统时长）。"

        【储能项目测算规则】
        - 系统时长仅支持 2 小时或 4 小时。用户明确提供其他时长时，告知“系统目前仅支持2小时或4小时储能项目”并请其重新选择，不得发起测算。
        - 用户仅提供功率与容量时，必须校验容量/功率得到的系统时长为 2 或 4；其他结果不得发起测算。
        - 项目规模满足下列任一组合即可发起测算，组合之外的规模参数可缺省：
          1. 功率与容量；
          2. 功率与系统时长；
          3. 容量与系统时长；
          4. 仅系统时长。
        - 用户未提供任何规模参数时，追问"请提供项目的功率和容量（或系统时长）"。
        - 【仅系统时长即可测算，MUST NOT 追问功率/容量】用户提供系统时长（如"2小时储能系统"）即满足规模要求，
          直接发起测算，后端会按默认功率 100MW 归一化容量；MUST NOT 追问或要求用户提供功率、容量。
        - 用户同时提供功率、容量和系统时长且三者不一致时，必须追问确认，不得自行覆盖任一参数。
        - 运营周期未提及时不追问、不传该参数；明确提及时仅接受 15 或 20，用户提供其他值时告知"系统仅支持15年或20年运营周期"并请用户重新选择。
        - 换电成本只在运营期为 20 年时才有意义（15 年恒为 0）；用户未提及时不传该参数，默认由系统按运营期补齐。
        - 电压等级未提及时不追问、不传该参数；明确提及时仅接受 110 或 220，用户提供其他值时告知"系统仅支持110kV或220kV电压等级"并请用户重新选择。

        【省份前置规则】
        - 发起测算前必须取得明确的标准省份或区域名称。
        - 用户原文中已明确提及省份或区域时，直接使用。
        - 用户提到节点但没有提供省份时，询问该节点所在的省份或区域；保留用户已提供的节点名称和其他测算参数，不调用任何工具。
        - 不得根据节点名称、常识或地名联想推断省份。
        - 省份映射规则：所有省份最终都要映射为下方省份或区域之一【浙江、上海、广东、江苏、湖南、深圳、海南、重庆、河南、安徽、湖北、天津、四川、陕西、贵州、辽宁、吉林、山东、黑龙江、山西、福建、江西、新疆、冀北、河北南网、蒙东、青海、云南、北京、广西、宁夏、蒙西、甘肃、西藏、冀南】。
        - 别称规则：
          1. 内蒙/内蒙古分为蒙东和蒙西，用户未明确指出时必须追问；
          2. 用户只说河北且未明确冀北、冀南或河北南网时，必须追问具体区域，不得自行选择。
        - 【河南省份识别补充】河南项目只需取得明确省份；城市如已提供则记录到 city，未提供则 city 为 null 或不传，并按河南省级统一结算价格发起测算。河南已提供省份时，若同时出现已知城市则提取城市，否则不得因缺少城市而追问。

        【节点校验与匹配规则】（其他省份项目）
        - 用户同时提供省份和地点名时（业务术语已排除），必须先调用 query_station_nodes 校验，禁止直接发起测算。
        - 节点只能从 query_station_nodes 返回的节点列表中选择，不得使用模型记忆、常识或自行编造的节点。
        - keyword 只传地点名的核心字（去掉"站/节点/厂/变电站/母线"等后缀，如"祥泰站"传"祥泰"），便于命中
          "祥泰站""芮城站/220kV.南母线"这类完整标准名；MUST NOT 把整串带后缀原文当 keyword 而漏召回。
        - keyword 长度少于2个汉字时，告知用户节点名称过短，请提供更具体的地点信息。
        - 返回项中包含用户核心字的即为候选：唯一候选直接采用其标准全名发起测算，无需向用户确认；
          多个候选时列出最多三个请用户确认。候选必须逐字来自列表，不得改写。
        - query_station_nodes 当前查询结果为空时，告知用户未找到匹配节点并请其检查名称或省份；
          MUST NOT 自行丢弃该地点名回退到省级（不带节点）测算，须由用户明确同意才可不带节点测算。
        - 节点查询接口失败时，说明节点信息暂时查询失败且本次未发起测算；不得将接口失败表述为节点不存在，也不得绕过校验继续测算。

        【测算调用与结果处理规则】
        - 省份已取得且项目规模满足要求后（节点按上述地点名规则处理），只调用一次 create_calculation_task。
        - 用户要求带节点测算时，节点名称必须是 query_station_nodes 返回并经用户确认或唯一匹配的标准名称。
        - create_calculation_task 返回成功时，如实保留并返回会话、任务、版本和状态。完整测算结果由业务系统根据任务标识获取，不得继续调用工具查询结果。
        - create_calculation_task 返回失败时，如实告知测算失败；仅可展示适合用户理解的业务错误，不得泄露内部堆栈、数据库信息或内部地址。
        - 节点查询或测算失败后，不得自动更换省份、节点、规模、电压等级或运营周期，不得自动重试；只有用户确认新输入后才能再次调用。
        - 保留后端响应，不重算、不改写、不推断或补全任何财务指标。

        【参数修改与重新测算规则】

        【修改意图识别与基线查询】
        - 识别修改意图：用户说"把功率改成X / 调整容量为X / 修改EPC单价 / 重新测算 / 按新参数再算一次 /
          换成某站再算"等，一律先按"可能是基于最近版本修改参数并重新测算"处理，MUST NOT 直接当全新测算发起。
        - 【先查基线，再判断】识别到修改意图时，MUST 无条件先调用一次 query_latest_calculation_params
          取得本会话最近一次成功测算的冻结入参，再根据返回结果决定走向：
            · 查到基线 → 按"基于基线修改参数并重新测算"处理，用户未改动的参数 MUST 沿用基线值，
              MUST NOT 凭记忆、猜测、常识或默认值臆造未提及的参数；
            · 未查到基线（本会话确无成功测算结果）→ 才按全新测算处理，追问省份和规模，不得虚构上一版参数。
          MUST NOT 在未调用本工具的情况下，仅凭主观判断认定"本会话尚无测算结果"而直接追问参数。
        - 只调用一次 create_calculation_task；省份必须沿用基线省份，不得修改。用户要求修改省份时，
          告知"省份在当前会话中不可修改，如需更换省份请新建会话"。
        - 【河南项目城市修改】河南项目的城市可修改，修改时直接按新的城市传入，不调用 query_station_nodes。

        【修改场景参数传递规则】
        - 【规模参数由后端自动补全】功率、容量、系统时长只传用户本次改动的项：
          只改功率 → 传新功率，后端自动沿用基线容量并派生时长（如 200/800 改功率 400 → 400/800 = 2小时系统）；
          只改容量 → 传新容量；只改系统时长 → 传新系统时长。
          MUST NOT 为凑齐规模组合而把基线功率/容量抄回，也不得用基线时长推算容量/功率。
        - 【节点、电压等级是顶层参数，后端不补全，MUST 从基线带出】修改场景下即便用户未提及这两个参数，
          也必须从 query_latest_calculation_params 返回的基线中原样带出并传入，MUST NOT 省略
          （省略会导致节点丢失、电压回落到默认 220）。
        - 【河南项目参数传递】河南项目不传 node_name；如基线有 city 则原样带出，用户修改城市时传入新 city；用户清空城市时不传 city。
        - 【其他省份修改节点】修改节点时，节点查询所用省份 MUST 是基线省份（来自 query_latest_calculation_params），
          MUST NOT 因用户未重复省份而反问"该节点所在省份"——当前会话省份已由基线确定。
        - 修改节点时，按基线省份调用一次 query_station_nodes，keyword 同样只传地点名核心字；唯一候选直接采用其标准全名，多个候选则请用户确认。
        - 基线省份节点列表中没有该节点时，如实告知"当前会话省份下没有找到这个节点"，MUST NOT 跨省搜索、
          MUST NOT 猜测或使用其他省份节点发起测算，请用户确认节点名称或更换节点。
        - 节点列表为空时按首次节点规则处理；未提及节点则沿用基线节点名称。
        - 运营周期未在本次改动中提及时沿用基线值，不重设为默认；明确提及时仅接受 15 或 20。
        - 改动项与基线不一致需要取舍时（如同时给出新功率和新容量但两者与时长冲突），追问用户确认，不得自行覆盖。
        - 不得把一次"修改参数"拆成多次调用；不得自动重试。修改后返回新版本的会话、任务、版本和状态。

        【高级参数修改规则】
        - 用户只改了基础参数（如功率）时，EPC 单价、贷款利率、现货价格等高级参数沿用基线，MUST NOT 重置为默认值。
        - 用户明确修改某个高级参数（如 EPC 单价、贷款利率、现货价格）时，直接把用户的新值作为该参数传入；
          未提及的高级参数仍沿用基线。
        - 【换电成本与运营期联动】换电成本（业务表述"换电成本"，单位 元/Wh）受运营期约束：
          运营期为 15 年时换电成本恒为 0、不可修改，用户要求修改时告知"15年档换电成本固定为0，不可修改"；
          运营期为 20 年时换电成本默认 0.3、可在 0~1 区间修改。
          【切运营期时不传基线换电成本】用户修改运营期（15↔20）时，除非用户显式提到换电成本，否则
          MUST NOT 把 query_latest_calculation_params 基线中的换电成本原样传入（基线的 0 只是旧档规则值，
          不是用户意图），直接不传该参数，由后端按新运营期默认（15→0，20→0.3）补齐；
          用户显式给出换电成本时，把用户值作为该参数传入——运营期为 15 年不得传非 0 值，运营期为 20 年以用户值为准。
    tools:
      - name: query_station_nodes
        description: |
          查询指定省份或区域下可用于储能测算的标准节点名称；把用户所说地点名的核心字作为 keyword 查询。

          用户在省份之外提到地名、设施名或站名（业务术语已排除）时必须先调用本工具校验，不得直接按不带节点测算。
          province 必须是标准省份或区域；未提供时先追问，不得猜测。keyword 去掉"站/节点/厂/变电站/母线"等后缀只留
          核心字，以便命中"祥泰站""芮城站/220kV.南母线"这类完整标准名。只使用本次返回列表完成匹配或给出最多三个
          候选，不自动翻页；最终节点名必须逐字来自返回列表。

          参数
          ----
          province : 节点所在的省份或区域（必填）
          keyword : 用户所说地点名的核心字（调用时填写）
        params:
          province:
            type: str
            required: true
            message: 请提供节点所在的省份或区域。
          keyword:
            type: str
            required: false
        http:
          method: GET
          path: /ir/calc/stations
          query:
            province: "{province}"
            keyword: "{keyword}"
            limit: 100
        answer_type: energy_storage.node_list
        render_hint: 返回标准节点名称列表；只能原样使用返回名称进行测算或请用户确认，当前结果无匹配时请用户检查节点名称或省份。

      - name: query_latest_calculation_params
        description: |
          查询本会话最近一次成功测算的冻结入参，作为"修改参数并重新测算"的基线。

          业务说明
          --------
          返回本会话最近一次成功测算的完整冻结入参：省份、河南项目城市、功率、容量、系统时长、节点、电压等级、
          运营周期，以及 EPC 单价、贷款利率、现货价格等全部可调参数。
          当用户要求修改已测算的参数并重新测算时，必须先调用本工具取得基线；未提及的参数 MUST 沿用
          基线值，MUST NOT 凭记忆、猜测或默认值虚构。本工具只读，不触发测算、不生成新版本；
          本会话无成功测算结果时按全新测算处理。
        http:
          method: GET
          path: /ir/calc/tasks/latest-input
        render_hint: 返回本会话最近一次成功测算的冻结入参（省份、规模、节点、电压、运营期及全部可调参数）；作为修改基线的唯一可信来源，只改动用户明确指定的参数，其余原样沿用。面向用户展示时用自然中文。

      - name: create_calculation_task
        description: |
          发起储能项目投研测算，或在已有测算基础上修改参数后重新测算并追加新版本。

          业务说明
          --------
          项目规模满足下列任一组合即可发起测算（组合之外的规模参数可缺省）：
          1. 功率与容量；2. 功率与系统时长；3. 容量与系统时长；4. 仅系统时长。
          河南项目的 city 可选。河南不传 node_name；提供 city 时使用城市对应的价格逻辑，不提供 city 时使用河南省级统一结算价格。city 只传城市名称，例如"濮阳"，不传省份和节点名称。仅有时长（如"2小时储能系统"）时只传 duration_hours，后端按默认功率 100MW 归一化容量，MUST NOT 追问或传功率/容量；node_name 为可选节点名称，带节点测算时 MUST 来自
          query_station_nodes 返回的标准节点列表且已唯一匹配或经用户确认；voltage_kv 仅支持 110 或 220；
          duration_hours 仅支持 2 或 4；operation_years 仅支持 15 或 20。本工具仅返回测算任务摘要，完整财务结果由业务系统根据 taskId 获取和展示。

          【修改参数场景】
          用户要求修改已测算的参数时，MUST 先调用 query_latest_calculation_params 取得本会话最近一次成功测算
          的冻结入参作为基线，未提及的参数沿用基线值；功率/容量/系统时长只传用户本次改动的项，未提及的规模
          参数由后端按上一版冻结入参自动补全（只改功率时容量沿用上一版、时长派生）；node_name、voltage_kv 是
          顶层参数、后端不补全，MUST 从基线原样带出，不得省略；EPC 单价、贷款利率、现货价格等高级参数未提及
          时由后端沿用上一版冻结值。

          参数
          ----
          province : 项目所在省份或区域（必填）
          city : 河南项目所在城市（可选，其他省份不传）
          power_mw : 功率（MW）
          capacity_mwh : 容量（MWh）
          duration_hours : 系统时长（小时）
          node_name : 节点名称（必须来自 query_station_nodes 标准列表）
          voltage_kv : 电压等级（仅 110 或 220）
          operation_years : 运营周期（年，仅 15 或 20）
          epc_unit_price : EPC单价（元/Wh）
          loan_rate : 贷款利率（小数，4% 填 0.04）
          loan_years : 贷款年限（年）
          daily_cycles : 日充放电次数
          spot_charge_avg : 现货充电均价（元/KWh）
          spot_discharge_avg : 现货放电均价（元/KWh）
          strategy_achievement_rate : 策略达成率
          capacity_achievement_rate : 容量达成率
          lease_achievement_rate : 租赁达成率
          battery_replace_cost : 电池更换成本
          maint_cost : 检修成本
          opex_cost : 运营成本
          mid_long_energy_revenue_first_year_tax : 中长期电量收益首年含税
          frequency_first_year_revenue : 调频首年收益
          intervention_first_year_revenue : 现货干预首年收益
          lease_unit_price : 租赁单价
        enable_ai_summary: false
        idempotent: false
        params:
          province:
            required: true
            message: 请提供项目所在省份。
          city:
            type: str
          capacity_mwh:
            type: float
          power_mw:
            type: float
          duration_hours:
            type: float
          node_name:
            type: str
          voltage_kv:
            type: int
          operation_years:
            type: int
          epc_unit_price:
            type: float
          loan_rate:
            type: float
          loan_years:
            type: int
          daily_cycles:
            type: float
          spot_charge_avg:
            type: float
          spot_discharge_avg:
            type: float
          strategy_achievement_rate:
            type: float
          capacity_achievement_rate:
            type: float
          lease_achievement_rate:
            type: float
          battery_replace_cost:
            type: float
          maint_cost:
            type: float
          opex_cost:
            type: float
          mid_long_energy_revenue_first_year_tax:
            type: float
          frequency_first_year_revenue:
            type: float
          intervention_first_year_revenue:
            type: float
          lease_unit_price:
            type: float
        http:
          method: POST
          path: /ir/calc/tasks
          body:
            province: "{province}"
            city: "{city}"
            capacity_mwh: "{capacity_mwh}"
            power_mw: "{power_mw}"
            duration_hours: "{duration_hours}"
            node_name: "{node_name}"
            voltage_kv: "{voltage_kv}"
            param_overrides:
              operation_years: "{operation_years}"
              epc_unit_price: "{epc_unit_price}"
              loan_rate: "{loan_rate}"
              loan_years: "{loan_years}"
              daily_cycles: "{daily_cycles}"
              spot_charge_avg: "{spot_charge_avg}"
              spot_discharge_avg: "{spot_discharge_avg}"
              strategy_achievement_rate: "{strategy_achievement_rate}"
              capacity_achievement_rate: "{capacity_achievement_rate}"
              lease_achievement_rate: "{lease_achievement_rate}"
              battery_replace_cost: "{battery_replace_cost}"
              maint_cost: "{maint_cost}"
              opex_cost: "{opex_cost}"
              mid_long_energy_revenue_first_year_tax: "{mid_long_energy_revenue_first_year_tax}"
              frequency_first_year_revenue: "{frequency_first_year_revenue}"
              intervention_first_year_revenue: "{intervention_first_year_revenue}"
              lease_unit_price: "{lease_unit_price}"
        answer_type: energy_storage.calculation_task
        render_hint: 返回测算任务摘要，包括 conversationId、taskId、version 和 status；完整测算结果由业务系统根据 taskId 获取，中台不查询结果接口。
