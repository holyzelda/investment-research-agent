name: Container smoke (isolated)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Capture graphical captcha prototype states
        run: ./scripts/capture-prototype-screenshots.sh
      - name: Verify screenshot outputs
        run: |
          test -s docs/superpowers/prototypes/screenshots/desktop-selected.png
          test -s docs/superpowers/prototypes/screenshots/mobile-verified.png
          file docs/superpowers/prototypes/screenshots/*.png | grep -c 'PNG image data' | grep -q '^2$'

  frontend-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build static frontend image
        run: docker build --pull -t zhu10-frontend:ci agent-frontend
      - name: Verify SPA and reject unconfigured gateway routes
        run: |
          docker run -d --name zhu10-frontend -p 127.0.0.1:18080:8080 zhu10-frontend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs zhu10-frontend; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/investment/ | grep -q '<div id="app"></div>'
          curl --fail --silent http://127.0.0.1:18080/investment/offline-route | grep -q '<div id="app"></div>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/gateway/ir-agent/health)" = 503

  backend-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build backend image without local configuration files
        run: docker build --pull -t zhu10-backend:ci agent-backend
      - name: Verify non-root runtime directories
        run: docker run --rm --entrypoint sh zhu10-backend:ci -ec 'test "$(id -u)" = 10001 && test -w "$HOME" && test -w /srv/ir-agent/logs/nacos'
      - name: Start disposable internal MySQL and initialize synthetic schema
        run: |
          docker network create --internal zhu10-smoke
          docker run -d --name zhu10-mysql --network zhu10-smoke \
            --health-cmd='mysqladmin ping -h localhost -uroot -ptest-root-ci-1234' \
            --health-interval=5s --health-timeout=3s --health-retries=20 \
            -e MYSQL_DATABASE=ir_agent_ci \
            -e MYSQL_USER=ci_runner \
            -e MYSQL_PASSWORD=test-ci-only-1234 \
            -e MYSQL_ROOT_PASSWORD=test-root-ci-1234 \
            mysql:8.0
          for attempt in $(seq 1 60); do
            if docker exec zhu10-mysql mysql -h 127.0.0.1 -uroot -ptest-root-ci-1234 \
              ir_agent_ci -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 60 ]; then docker logs zhu10-mysql; exit 1; fi
            sleep 2
          done
          docker exec -i zhu10-mysql mysql -h 127.0.0.1 -uroot -ptest-root-ci-1234 ir_agent_ci < agent-backend/sql/ir_agent_schema.sql
          docker exec -i zhu10-mysql mysql -h 127.0.0.1 -uroot -ptest-root-ci-1234 ir_agent_ci < agent-backend/sql/spot_precompute_schema.sql
      - name: Verify backend health and missing-identity denial without network egress
        run: |
          docker run -d --name zhu10-backend --network zhu10-smoke \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -e IR_DB_URL=mysql+aiomysql://ci_runner:test-ci-only-1234@zhu10-mysql:3306/ir_agent_ci \
            -e APP_PORT=19089 \
            -e NACOS_ENABLED=false -e IR_FEISHU_ENABLED=false \
            -e IR_SPOT_ENABLED=false -e IR_SPOT_DAILY_UPDATE_ENABLED=false \
            zhu10-backend:ci
          docker exec -i zhu10-backend python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          for attempt in range(60):
              try:
                  with urlopen('http://127.0.0.1:19089/health', timeout=2) as response:
                      payload = json.load(response)
                      assert response.status == 200 and payload['data']['status'] == 'up'
                  break
              except (URLError, TimeoutError):
                  time.sleep(2)
          else:
              raise RuntimeError('Backend did not become healthy')

          request = Request('http://127.0.0.1:19089/ir/chat/diag', data=b'{}',
                            headers={'Content-Type': 'application/json'}, method='POST')
          try:
              urlopen(request, timeout=3)
          except HTTPError as error:
              payload = json.load(error)
              assert error.code == 401 and payload['code'] == 401
          else:
              raise AssertionError('Missing identity was accepted')
          PY
      - name: Verify CI-only synthetic gateway rejects missing auth and overwrites identity
        run: |
          set -euo pipefail
          CI_PASSWORD="$(openssl rand -hex 24)"
          printf 'ci:%s\n' "$(printf '%s' "$CI_PASSWORD" | openssl passwd -apr1 -stdin)" > "$RUNNER_TEMP/zhu16-htpasswd"
          cat > "$RUNNER_TEMP/zhu16-gateway.conf" <<'NGINX'
          server {
              listen 8080;
              server_name _;
              location = /healthz {
                  return 200 "ok";
              }
              location = /gateway/ir-agent/ir/me {
                  auth_basic "isolated CI";
                  auth_basic_user_file /etc/nginx/ci-htpasswd;
                  proxy_set_header Authorization "";
                  proxy_set_header userId "zhu16-ci";
                  proxy_set_header username "Synthetic%20Tester";
                  proxy_pass http://zhu10-backend:19089/ir/me;
              }
              location / {
                  return 404;
              }
          }
          NGINX
          docker run -d --name zhu16-gateway --network zhu10-smoke \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$RUNNER_TEMP/zhu16-gateway.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/zhu16-htpasswd:/etc/nginx/ci-htpasswd:ro" \
            nginxinc/nginx-unprivileged:stable-alpine
          docker exec -i -e CI_PASSWORD="$CI_PASSWORD" zhu10-backend python - <<'PY'
          import base64
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "http://zhu16-gateway:8080"
          for attempt in range(30):
              try:
                  with urlopen(base + "/healthz", timeout=2) as response:
                      assert response.status == 200
                  break
              except (URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise RuntimeError("CI gateway did not become healthy")

          def fetch(path, headers=None):
              request = Request(base + path, headers=headers or {})
              try:
                  with urlopen(request, timeout=3) as response:
                      return response.status, json.load(response)
              except HTTPError as error:
                  return error.code, error.read()

          path = "/gateway/ir-agent/ir/me"
          assert fetch(path)[0] == 401
          wrong = base64.b64encode(b"ci:wrong").decode("ascii")
          assert fetch(path, {"Authorization": "Basic " + wrong})[0] == 401

          password = os.environ["CI_PASSWORD"]
          credential = base64.b64encode(("ci:" + password).encode()).decode("ascii")
          headers = {
              "Authorization": "Basic " + credential,
              "userId": "forged-user",
              "username": "Forged%20User",
          }
          status, payload = fetch(path, headers)
          assert status == 200, (status, payload)
          assert payload["data"] == {
              "userId": "zhu16-ci",
              "username": "Synthetic Tester",
          }, payload
          assert fetch("/gateway/ir-agent/ir/chat/diag", headers)[0] == 404
          PY
      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs zhu10-backend || true
          docker logs zhu16-gateway || true
